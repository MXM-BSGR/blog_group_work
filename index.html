<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Blog</title>
    <link rel="stylesheet" href="./CSS/fonts.css" />
    <link rel="stylesheet" href="./CSS/header_and_footer.css" />
    <link rel="stylesheet" href="./CSS/style.css" />
  </head>
  <body>
    <header></header>
    <main>
      <section class="hero">
        <div class="hero-image">
          <img
            src="assets/img/hero/cappadocia.png"
            alt="Cappadocia bei Sonnenaufgang"
          />
        </div>
        <img
          class="hero-yellow-shape"
          src="assets/img/hero/yellow_bg.png"
          alt=""
        />
        <div class="hero-text">
          <h1>Cappadocia</h1>
          <p>
            From sunrise balloons to hidden cave dwellings, every moment feels
            unreal in the best way.
          </p>
        </div>
        <div class="badge">
          <img
            class="badge-bg"
            src="assets/img/hero/badge-circle-green.png"
            alt=""
          />
          <img
            class="badge-text"
            src="assets/img/hero/badge-text-ring.png"
            alt=""
          />
          <img
            class="badge-flag"
            src="assets/img/hero/turkey-flag.png"
            alt="Turkey"
          />
        </div>
      </section>

      <section class="highlights"></section>
      <section class="faq"></section>
      <section class="contact"></section>
    </main>
    <footer></footer>
  </body>
</html>
